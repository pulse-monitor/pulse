name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消旧任务，别把 runner 耗在过期的提交上
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI 里不需要增量编译，反而更慢更占盘
  CARGO_INCREMENTAL: 0

jobs:
  # workflow 文件本身也要检。语法/上下文错误不会让某个 job 变红 ——
  # 整个 workflow 直接解析失败、**一个 job 都不起**，页面上只看到一条
  # 没有任何日志的 failure。实际踩过：secrets 上下文在 step 的 if: 里不可用。
  workflows:
    name: Workflow 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  rust:
    name: Rust（格式 / clippy / 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # 面板只发 Linux 二进制（它跑在你自己的服务器上），但 musl 静态链接
  # 要交叉编译：ring 的 build script 需要目标平台的 C 编译器，zig 一个顶五个。
  cross-linux:
    name: 交叉编译（${{ matrix.target }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release --target ${{ matrix.target }} --workspace

  security:
    name: 安全（迁移不可变 / 依赖审计）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 已发布的迁移文件改一个字节，已部署的实例就全部起不来（sqlx 校验和）
      - run: bash tools/check-migrations.sh
      - run: cargo install cargo-audit cargo-deny --locked
      # 安全公告 + 许可证 + 「被忽略项的前提是否仍然成立」
      - run: bash tools/check-deps.sh

  # 探针的安装脚本由面板内嵌并提供（include_str! + GET /install.sh），
  # 所以它跟着面板走、也在这里检查
  scripts:
    name: 安装脚本（shellcheck）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck deploy/scripts/*.sh tools/*.sh
