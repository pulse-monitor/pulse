name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true # 少一个架构就不该发布
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # ring 的 build script 要目标平台的 C 编译器，zig 一个顶五个
      - uses: mlugg/setup-zig@v2
      - run: cargo install cargo-zigbuild --locked
      - name: 构建
        env:
          # 经 env 传进来而不是把 ${{ }} 直接拼进脚本
          TARGET: ${{ matrix.target }}
        run: |
          set -Eeuo pipefail
          cargo zigbuild --release --target "$TARGET" -p pulse-server
          mkdir -p dist
          cp "target/$TARGET/release/pulse-server" "dist/pulse-server-$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/
          retention-days: 1

  publish:
    name: 发布
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging
      - name: 汇总并生成摘要
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          cd dist
          sha256sum ./* > SHA256SUMS
          # 去掉 ./ 前缀 —— 安装脚本是按裸文件名查的
          sed -i 's| \./| |; s|\*\./|*|' SHA256SUMS
          cat SHA256SUMS

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # 面板发版时同步给协议打一个 tag：探针仓库按 tag 引用 pulse-proto，
  # 没有 tag 它就取不到新协议
  proto-tag:
    name: 给协议打 tag
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 打 proto tag
        env:
          REF: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          tag="proto-${REF}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag"
          git push -f origin "$tag"
          echo "✔ $tag -> $(git rev-parse --short HEAD)"
