[workspace]
resolver = "2"
members = ["crates/pulse-proto", "crates/pulse-agent", "crates/pulse-server", "crates/pulse-loadgen"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
pulse-proto  = { path = "crates/pulse-proto" }
pulse-server = { path = "crates/pulse-server" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow      = "1"

[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true
