[package]
name = "pulse-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pulse-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
sysinfo = "0.36.1"
rand = "0.9.5"
nvml-wrapper = { version = "0.13.0", optional = true }
# 必须关掉默认 feature：rustls 0.23 默认用 aws-lc-rs，它需要目标平台的
# C 编译器，会直接打断 musl 交叉编译。ring 是纯 Rust + 汇编，交叉编译没问题。
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.9"
# 解析用户给的 CA 证书文件（PULSE_CA_CERT）。
# 用 rustls 官方的 pki-types 而不是 rustls-pemfile —— 后者已经无人维护
# （RUSTSEC-2025-0134），而 PEM 解析本来就该由类型库自己提供。
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# 自更新的签名校验。零依赖、纯 Rust、作者就是 minisign 本人（MIT）。
# 只做**验证**，不含签名功能 —— agent 里没有任何需要私钥的代码路径。
minisign-verify = "0.2.5"
sha2 = "0.10.9"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[features]
default = []
# NVML 动态加载（不调 nvidia-smi 子进程，见 R18）。未启用时 GPU 采集静默返回 None。
gpu = ["dep:nvml-wrapper"]

[dev-dependencies]
tempfile = "3.27.0"
