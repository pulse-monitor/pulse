[package]
name = "pulse-loadgen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "M1 容量验证：按稳态体量生成数据并测量体积与查询延迟"

[[bin]]
name = "pulse-loadgen"
path = "src/main.rs"

[[bin]]
name = "pulse-wsload"
path = "src/bin/wsload.rs"

[dependencies]
pulse-server.workspace = true
pulse-proto.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
anyhow.workspace = true
rand = "0.9"
tokio-tungstenite = "0.29.0"
futures-util = "0.3.34"
